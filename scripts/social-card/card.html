<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #0f1116 url("backdrop.webp") center / cover no-repeat;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #fff;
  }
  .shade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(10,12,16,.82) 0%, rgba(10,12,16,.55) 45%, rgba(10,12,16,0) 80%);
  }
  .text {
    position: absolute; left: 80px; bottom: 84px;
    text-shadow: 0 2px 16px rgba(0,0,0,.45);
  }
  h1 { margin: 0; font-size: 84px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; }
  p { margin: 18px 0 0; font-size: 38px; font-weight: 400; opacity: .92; }
  .url { margin-top: 40px; font-size: 26px; font-weight: 500; opacity: .75; letter-spacing: .01em; }
</style>
</head>
<body>
  <div class="shade"></div>
  <div class="text">
    <h1>Shane Loeffler</h1>
    <p>Maps, software, and science</p>
    <div class="url">shaneloeffler.com</div>
  </div>
</body>
</html>
